name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64_RAW: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64_RAW"
          if printf '%s\n' "$ANDROID_KEYSTORE_BASE64_RAW" | grep -q '^ANDROID_KEYSTORE_BASE64='; then
            KEYSTORE_BASE64_CLEAN="$(printf '%s\n' "$ANDROID_KEYSTORE_BASE64_RAW" | sed -n 's/^ANDROID_KEYSTORE_BASE64=//p' | head -n 1)"
          else
            KEYSTORE_BASE64_CLEAN="$(printf '%s\n' "$ANDROID_KEYSTORE_BASE64_RAW" | head -n 1)"
          fi
          printf '%s' "$KEYSTORE_BASE64_CLEAN" | tr -d '[:space:]' | base64 --decode > app/release.jks

      - name: Compilar APK assinado
        env:
          ANDROID_KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          extract_secret() {
            RAW_VALUE="$1"
            SECRET_NAME="$2"
            if printf '%s\n' "$RAW_VALUE" | grep -q "^${SECRET_NAME}="; then
              printf '%s\n' "$RAW_VALUE" | sed -n "s/^${SECRET_NAME}=//p" | head -n 1 | tr -d '\r'
            else
              printf '%s\n' "$RAW_VALUE" | head -n 1 | tr -d '\r'
            fi
          }
          export ANDROID_KEYSTORE_PASSWORD="$(extract_secret "$ANDROID_KEYSTORE_PASSWORD_RAW" ANDROID_KEYSTORE_PASSWORD)"
          export ANDROID_KEY_ALIAS="$(extract_secret "$ANDROID_KEY_ALIAS_RAW" ANDROID_KEY_ALIAS)"
          export ANDROID_KEY_PASSWORD="$(extract_secret "$ANDROID_KEY_PASSWORD_RAW" ANDROID_KEY_PASSWORD)"
          gradle :app:assembleRelease --no-daemon

      - name: Preparar arquivo
        run: cp app/build/outputs/apk/release/app-release.apk Templo-Gloria-Eterna.apk

      - name: Guardar APK do teste
        uses: actions/upload-artifact@v4
        with:
          name: Templo-Gloria-Eterna
          path: Templo-Gloria-Eterna.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Aplicativo Android ${{ github.run_number }}
          make_latest: true
          files: Templo-Gloria-Eterna.apk
